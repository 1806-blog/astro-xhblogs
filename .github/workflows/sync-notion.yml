name: Sync Notion

# 每 10 分钟从 Notion 拉文章到 src/posts，有变化就提交，Vercel 自动重新部署。
#
# 仓库已转为公开，Actions 时长不限量。装 @elog/cli 要几十秒，所以：
#   - 用 actions/cache 缓存 npm 包，第二次起安装只要几秒
#   - 频率取 10 分钟（文章不像说说那么急，没必要挤到 5 分钟）
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-elog-0.14.7
          restore-keys: ${{ runner.os }}-npm-

      - name: 安装 Elog
        run: npm i -g @elog/cli@0.14.7 --prefer-offline --no-audit --no-fund

      - name: 同步 Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          elog sync -c elog.posts.cjs || echo "::warning::文章同步失败，请看上面的 elog 输出"
          elog sync -c elog.chatters.cjs || echo "::warning::杂谈同步失败，请看上面的 elog 输出"

      # Elog 只会新增/更新，不会删。这一步把「Notion 里已删除但本地还留着」的 md 清掉。
      - name: 清理已删除的文档
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/notion-prune.mjs

      - name: 有变化就提交
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "notion-sync@users.noreply.github.com"
          git add src/posts src/chatters
          # 图片目录可能还不存在，单独判断，否则 git add 会以 128 退出把整个步骤弄崩
          if [ -d public/notion-assets ]; then
            git add public/notion-assets
          fi
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(posts): sync from notion"
            git push
          fi
