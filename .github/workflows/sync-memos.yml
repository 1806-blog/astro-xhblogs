name: Sync Memos

# 每 10 分钟拉一次 Memos，有新说说就写进 src/moments 并提交，
# 提交后 Vercel 会自动重新部署。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memos-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步 Memos
        env:
          MEMOS_BASE_URL: ${{ secrets.MEMOS_BASE_URL }}
          MEMOS_TOKEN: ${{ secrets.MEMOS_TOKEN }}
          STORAGE_API: ${{ vars.STORAGE_API }}
          STORAGE_PUBLIC: ${{ vars.STORAGE_PUBLIC }}
        run: node scripts/memos-sync.mjs

      - name: 有变化就提交
        run: |
          git config user.name "memos-sync[bot]"
          git config user.email "memos-sync@users.noreply.github.com"
          git add src/moments
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(moments): sync from memos"
            git push
          fi
