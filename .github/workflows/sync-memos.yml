name: Sync Memos

# 每 30 分钟拉一次 Memos，有新说说就写进 src/moments 并提交，
# 提交后 Vercel 会自动重新部署。
#
# 为什么是 30 分钟而不是 10 分钟：私有仓库的 Actions 免费额度是 2000 分钟/月,
# */10 一天跑 144 次，一个月会超；*/30 是 48 次/天，约 720 分钟/月，留有余量。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memos-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步 Memos
        env:
          MEMOS_BASE_URL: ${{ secrets.MEMOS_BASE_URL }}
          MEMOS_TOKEN: ${{ secrets.MEMOS_TOKEN }}
          STORAGE_API: ${{ vars.STORAGE_API }}
          STORAGE_PUBLIC: ${{ vars.STORAGE_PUBLIC }}
        run: node scripts/memos-sync.mjs

      - name: 有变化就提交
        run: |
          git config user.name "memos-sync[bot]"
          git config user.email "memos-sync@users.noreply.github.com"
          # src/moments 是空目录时 git 不跟踪它，全新 checkout 里不存在，
          # 直接 git add 会以 128 退出把整个步骤弄崩，所以先判断
          if [ -d src/moments ]; then
            git add src/moments
          else
            echo "src/moments 不存在（还没有说说），跳过"
          fi
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(moments): sync from memos"
            git push
          fi
