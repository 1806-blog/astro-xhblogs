name: Sync Memos

# 每 5 分钟拉一次 Memos，有新说说就写进 src/moments 并提交，
# 提交后 Vercel 会自动重新部署。
#
# 仓库已转为公开，Actions 时长不限量，所以可以直接用 GitHub 允许的最快间隔
# （schedule 的最小粒度是 5 分钟）。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memos-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步 Memos
        env:
          MEMOS_BASE_URL: ${{ secrets.MEMOS_BASE_URL }}
          MEMOS_TOKEN: ${{ secrets.MEMOS_TOKEN }}
          # 想让私密说说也发出来就设成 true
          MEMOS_INCLUDE_PRIVATE: 'false'
          STORAGE_API: ${{ vars.STORAGE_API }}
          STORAGE_PUBLIC: ${{ vars.STORAGE_PUBLIC }}
        run: node scripts/memos-sync.mjs

      - name: 有变化就提交
        run: |
          git config user.name "memos-sync[bot]"
          git config user.email "memos-sync@users.noreply.github.com"
          # src/moments 是空目录时 git 不跟踪它，全新 checkout 里不存在，
          # 直接 git add 会以 128 退出把整个步骤弄崩，所以先判断
          if [ -d src/moments ]; then
            git add src/moments
          else
            echo "src/moments 不存在（还没有说说），跳过"
          fi
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(moments): sync from memos"
            git push
          fi
